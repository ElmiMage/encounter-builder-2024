name: Build release assets

# Builds module.zip from exactly the files Foundry needs to run the module
# (matches the previously-manual process: module.json, LICENSE, README.md,
# scripts/, styles/, templates/ — NOT the dev-only docs like CLAUDE.md or
# ARCHITECTURE.md) and attaches it plus a standalone module.json to a DRAFT
# GitHub Release for the pushed tag.
#
# Deliberately creates a DRAFT, not a published release — the notes here
# are a placeholder. Writing the real, curated release notes and
# publishing (gh release edit <tag> --notes "..." --draft=false, or via
# the GitHub web UI) stays a separate, deliberate step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin download URL to this tag
        # The committed module.json's "download" points at /releases/latest/
        # as a source-tree placeholder — fine for manifest (which SHOULD
        # float to whatever's newest), wrong for download. A specific
        # version's module.json must download that SAME version, or
        # picking an old version from Foundry's "Add Version" list (or the
        # package browser's version dropdown) silently installs whatever
        # is currently latest instead. Rewritten here, in the build
        # artifact only — never committed back to the repo.
        run: sed -i "s#releases/latest/download/module.zip#releases/download/${{ github.ref_name }}/module.zip#" module.json

      - name: Build module.zip
        run: zip -r module.zip module.json LICENSE README.md scripts styles templates

      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            module.zip \
            module.json \
            --title "${{ github.ref_name }}" \
            --draft \
            --notes "Draft release for ${{ github.ref_name }} — module.zip and module.json were built automatically from this tag. Replace these notes with the real changelog and publish when ready."
